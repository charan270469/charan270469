<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Epilogue;font-weight:900;src:url(node_modules/@fontsource/epilogue/files/epilogue-latin-900-normal.woff2)}
@font-face{font-family:Epilogue;font-weight:800;src:url(node_modules/@fontsource/epilogue/files/epilogue-latin-800-normal.woff2)}
@font-face{font-family:Manrope;font-weight:500;src:url(node_modules/@fontsource/manrope/files/manrope-latin-500-normal.woff2)}
@font-face{font-family:Manrope;font-weight:800;src:url(node_modules/@fontsource/manrope/files/manrope-latin-800-normal.woff2)}
html,body{margin:0;background:transparent}
#banner{position:relative;width:960px;height:250px;border-radius:18px;overflow:hidden;background:#0A0908;box-shadow:inset 0 0 0 1px #3A3532}
#veil{position:absolute;inset:0}
.relative{position:relative}.h-full{height:100%}.w-full{width:100%}.overflow-hidden{overflow:hidden}
.absolute{position:absolute}.inset-0{inset:0}.block{display:block}
#shade{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 60%,rgba(10,9,8,.45),rgba(10,9,8,0) 70%)}
#frame{position:absolute;inset:0;border-radius:18px;box-shadow:inset 0 0 0 1px #3A3532}
.t{position:absolute;white-space:nowrap}
#tag{left:0;right:0;top:24px;text-align:center;font:500 14px Manrope;letter-spacing:.6px;color:#D9C7B3}
#name{left:36px;top:52px;font:900 168px/1 Epilogue;letter-spacing:-4px;background:linear-gradient(100deg,#C98F63 0%,#E8B98C 55%,#FBD9AA 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 18px rgba(0,0,0,.45))}
#roles{left:36px;bottom:18px;font:800 12px Manrope;letter-spacing:2.2px;color:#7AA5B4}
#dd{right:36px;bottom:14px;font:800 18px Epilogue;letter-spacing:1.2px;color:#D4B48C}
</style>
<script>
window.__origRaf=window.requestAnimationFrame.bind(window);window.__cbs=[];
window.requestAnimationFrame=function(cb){window.__cbs.push(cb);return window.__cbs.length;};
window.cancelAnimationFrame=function(){};
window.__step=function(ts){var c=window.__cbs;window.__origRaf=window.requestAnimationFrame.bind(window);window.__cbs=[];c.forEach(function(f){f(ts)});};
</script>
</head>
<body>
<div id="banner">
  <div id="veil"></div>
  <div id="shade"></div>
  <div class="t" id="tag">Detach &amp; do it...</div>
  <div class="t" id="name">CHARAN</div>
  <div class="t" id="roles">AI/ML ENGINEER &nbsp;/&nbsp; AGENTIC SYSTEMS &nbsp;/&nbsp; FULL STACK</div>
  <div class="t" id="dd">DEVELOPER &amp; DESIGNER</div>
  <div id="frame"></div>
</div>
<script src="dist/bundle.js"></script>
<script>
document.fonts.ready.then(function(){
  var n=document.getElementById('name');
  var w=n.getBoundingClientRect().width, target=888;
  var fs=parseFloat(getComputedStyle(n).fontSize);
  if(w>target){n.style.fontSize=(fs*target/w)+'px';}
  n.style.left=(960-n.getBoundingClientRect().width)/2+'px';
  window.__ready=true;
});
</script>
</body></html>
