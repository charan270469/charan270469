name: Update whoami card

on:
  schedule:
    - cron: "17 */12 * * *"  # every 12 hours
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate_whoami.py"
      - "assets/portrait.jpg"

permissions:
  contents: write

concurrency:
  group: whoami
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate card
        run: python scripts/generate_whoami.py charan270469

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/whoami.svg
          git diff --cached --quiet || git commit -m "chore: refresh whoami card"
          git push
